# nginx config for the frontend container.
#
# Two jobs:
#   1. serve the SPA, falling back to index.html so client-side routes like
#      /functions/abc123 work on a hard refresh
#   2. proxy /api to the control plane, so the browser sees one origin and
#      CORS never enters the picture in production

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed asset filenames are immutable -- cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves browsers pointing at
    # asset filenames that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://lb:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Function invocations can take up to the 30s execution limit plus
        # dispatch overhead. The default 60s read timeout would cut them off.
        proxy_read_timeout 90s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
