# Layer 7 load balancer in front of the control-plane replicas.
#
# This is the stand-in for an AWS Application Load Balancer, and it is
# configured to behave like one so the local topology and the deployed one
# fail the same way.
#
# The interesting constraint here is DNS, not the balancing algorithm.
#
# Open-source nginx resolves the hostname in an `upstream` block exactly once,
# at config load. Containers get new IPs whenever they are recreated -- a
# rebuild, a scale change, an OOM restart -- and nginx keeps proxying to the
# address that is no longer there, returning 504 until someone reloads it. On
# a small host where the control plane can be OOM-killed, that turns a
# recoverable restart into permanent downtime.
#
# `resolve` on an upstream server fixes this, but it is an NGINX Plus feature.
# The open-source workaround is to put the hostname in a variable, which forces
# nginx to resolve it per request through Docker's embedded DNS at 127.0.0.11.
#
# The cost is real and worth naming: a variable proxy_pass cannot use an
# upstream block, so this balances by whatever order Docker DNS returns the
# replica addresses in, not by least-connections. That is the wrong trade for
# a production fleet, where invocations hold a connection for as long as the
# function runs and least-outstanding is what actually tracks load -- so the
# ALB in infra/terraform does least-outstanding properly. Here, self-healing
# beats optimal, because a stale address is an outage and an uneven split is
# not.

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Docker's embedded DNS. The short TTL is what makes a recreated
    # control-plane container reachable again within seconds.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 8080;

        location / {
            # The variable is load-bearing: it defers resolution to request
            # time. Writing the hostname inline here would cache it forever.
            set $control_plane "control-plane:8000";
            proxy_pass http://$control_plane;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Retry the next replica when one refuses or dies mid-request.
            # Deliberately NOT retrying on timeout: a function that ran for 90
            # seconds should not be silently run a second time.
            proxy_next_upstream error non_idempotent;
            proxy_connect_timeout 2s;
            proxy_read_timeout 90s;
        }

        # The LB's own liveness, distinct from the control plane's.
        location = /lb-health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
