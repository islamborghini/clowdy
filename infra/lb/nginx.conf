# Layer 7 load balancer in front of the control-plane replicas.
#
# This is the stand-in for an AWS Application Load Balancer, and it is
# configured to behave like one so the local topology and the deployed one
# fail the same way.
#
# Why least_conn rather than round-robin: control-plane requests are wildly
# uneven. Listing projects is a 2ms database read; invoking a function holds
# the connection for as long as the function runs. Round-robin counts requests,
# so it keeps feeding a replica that is sitting on eight 20-second invocations.
# least_conn counts open connections, which is the thing that actually
# correlates with how busy a replica is.

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    upstream control_plane {
        least_conn;

        # Docker Compose's DNS resolves this to every replica of the service.
        # max_fails/fail_timeout is the health check: three consecutive errors
        # take a replica out of rotation for 10 seconds, then it is retried.
        server control-plane:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://control_plane;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Retry the next replica when one refuses or dies mid-request.
            # Deliberately NOT retrying on timeout: a function that ran for 90
            # seconds should not be silently run a second time.
            proxy_next_upstream error non_idempotent;
            proxy_connect_timeout 2s;
            proxy_read_timeout 90s;
        }

        # The LB's own liveness, distinct from the control plane's.
        location = /lb-health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
